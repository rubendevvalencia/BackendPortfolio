
name: docker-micro-events-production

services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017" ] #Configuración de como trabaja el mongoDb como cluster como es realmente en producción
    ports: 
      - 27017:27017
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: echo "try {rs.status()} catch(err){try{rs.initiate({_id:'rs0', members:[{_id:0, host:'host.docker.internal:27017'}]})}catch(e){print('EX_HELPER_R - ' + e.message); quit(1)}}" | mongosh --port 27017 -quiet
      interval: 5s
      timeout: 30s
      start_period: 0s
      start_interval: 1s
      retries: 30 #Reintentos healthcheck
    volumes: #aquí se guardan los datos
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb

  zookeeper: #Servicio que coordina el clúster (config, elección de líder, metadatos); lo necesitan brokers como Kafka
    image: bitnamilegacy/zookeeper:3.9.1 #Imagen de Zookeeper 3.9.1 de Bitnami
    container_name: zookeper #Nombre fijo del contenedor en Docker (typo: "zookeper"); otros servicios lo usarían como host dentro de la red
    tmpfs: "/zktmp" #Monta /zktmp en RAM: se borra al parar el contenedor, sirve para ficheros temporales
    restart: always #Se reinicia solo si cae o al arrancar Docker, salvo que lo pares tú a mano
    ports:
     - "2181:2181" #Puerto host:contenedor; 2181 es el puerto de clientes de Zookeeper
    volumes:
     - "zookeeper_data:/bitnami" #Volumen con nombre que persiste los datos de Zookeeper (/bitnami es su carpeta de datos); debe declararse abajo en "volumes"
    environment:
     - ALLOW_ANONYMOUS_LOGIN=yes #Permite conexiones sin autenticación (válido en desarrollo, no en producción)

  kafka:
    image: bitnamilegacy/kafka:3.7.0
    container_name: kafka
    ports:
     - "9092:9092"
     - "29092:29092"
    restart: always
    volumes:
     - "kafka_data:/bitnami"
    environment: 
     KAFKA_BROKER_ID: 1 #Le ponemos solo un broker para no reventar pero se podría poner un cluster con más brokers
     KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
     KAFKA_CFG_LISTENERS: INTERNAL://:9092, EXTERNAL://0.0.0.0:29092
     KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka:9092, EXTERNAL://localhost:29092
     KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT, EXTERNAL:PLAINTEXT
     KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
     KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: 'true'
     ALLOW_PLAINTEXT_LISTENER: 'yes'
    depends_on:
     - zookeeper

  kafka-ui:
   image: provectuslabs/kafka-ui:v0.7.2
   container_name: kafkaui
   depends_on:
    - kafka
   ports:
    - "8080:8080"
   environment:
    KAFKA_CLUSTERS_0_NAME: local
    KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    

volumes: #configuración de data de forma local, guardado físico
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  kafka_data:
    driver: local
  zookeeper_data:
    driver: local


networks:
  default: 
    name: microserviceNetwork