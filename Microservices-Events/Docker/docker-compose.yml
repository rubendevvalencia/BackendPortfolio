
name: docker-micro-events-production

services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017" ] #Configuración de como trabaja el mongoDb como cluster como es realmente en producción
    ports: 
      - 27017:27017
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: echo "try {rs.status()} catch(err){try{rs.initiate({_id:'rs0', members:[{_id:0, host:'host.docker.internal:27017'}]})}catch(e){print('EX_HELPER_R - ' + e.message); quit(1)}}" | mongosh --port 27017 -quiet
      interval: 5s
      timeout: 30s
      start_period: 0s
      start_interval: 1s
      retries: 30 #Reintentos healthcheck
    volumes: #aquí se guardan los datos
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb

volumes: #configuración de data de forma local, guardado físico
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local


networks:
  default: 
    name: microserviceNetwork