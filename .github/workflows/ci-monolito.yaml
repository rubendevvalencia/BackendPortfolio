name: CI-Monolito

on:
  push:
    branches: [dev, main]
    paths:
      - "Monolito/**"
      - ".github/workflows/ci-monolito.yaml"
  pull_request:
    branches: [dev, main]
    paths:
      - "Monolito/**"
      - ".github/workflows/ci-monolito.yaml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore Project
        run: dotnet restore Monolito/Ecommerce.slnx

      - name: Build Project
        run: dotnet build Monolito/Ecommerce.slnx --configuration Release

      - name: Test Project
        # Ecommerce.IntegrationTest queda fuera: necesita una DB SQL Server real y secretos
        # que este runner no tiene. Se corre solo local/manualmente hasta que el pipeline
        # levante un contenedor de SQL Server para él.
        run: dotnet test Monolito/Ecommerce.Test/Ecommerce.Test.csproj --configuration Release
