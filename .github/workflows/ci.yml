name: CI-Actions

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore Project
        run: dotnet restore Ecommerce.slnx

      - name: Build Project
        run: dotnet build Ecommerce.slnx --configuration Release

      - name: Test Project
        run: dotnet test Ecommerce.slnx --configuration Release
